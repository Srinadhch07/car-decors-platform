<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.5" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea580c" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="400" y1="200" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="800" fill="url(#bg)"/>
  <rect width="1920" height="800" fill="url(#accent)"/>
  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="1920" y2="800"/>
    <line x1="200" y1="0" x2="1920" y2="600"/>
    <line x1="400" y1="0" x2="1920" y2="400"/>
    <line x1="600" y1="0" x2="1920" y2="200"/>
    <line x1="0" y1="200" x2="1720" y2="800"/>
    <line x1="0" y1="400" x2="1520" y2="800"/>
    <line x1="0" y1="600" x2="1320" y2="800"/>
  </g>
  <!-- Abstract car silhouette - stylized side profile -->
  <g transform="translate(1100, 280)" opacity="0.08">
    <!-- Car body -->
    <path d="M0,180 L40,180 L80,140 L200,100 L320,80 L440,80 L520,100 L560,140 L600,180 L600,220 L0,220 Z" fill="white"/>
    <!-- Roof line -->
    <path d="M120,140 L200,60 L360,40 L440,60 L480,100" stroke="white" stroke-width="3" fill="none"/>
    <!-- Windows -->
    <path d="M140,130 L210,65 L310,50 L310,130 Z" fill="white" opacity="0.5"/>
    <path d="M320,50 L400,65 L460,100 L320,130 Z" fill="white" opacity="0.5"/>
    <!-- Wheels -->
    <circle cx="140" cy="220" r="40" fill="white"/>
    <circle cx="140" cy="220" r="20" fill="#111111"/>
    <circle cx="460" cy="220" r="40" fill="white"/>
    <circle cx="460" cy="220" r="20" fill="#111111"/>
  </g>
  <!-- Decorative accent line -->
  <rect x="0" y="700" width="1920" height="2" fill="#ea580c" opacity="0.3"/>
  <!-- Geometric accents -->
  <circle cx="1600" cy="200" r="150" fill="none" stroke="#ea580c" stroke-width="0.5" opacity="0.1"/>
  <circle cx="1600" cy="200" r="200" fill="none" stroke="#ea580c" stroke-width="0.3" opacity="0.06"/>
  <rect x="100" y="100" width="60" height="2" fill="#ea580c" opacity="0.2"/>
  <rect x="100" y="110" width="40" height="2" fill="#ea580c" opacity="0.15"/>
  <!-- Shine overlay -->
  <rect width="1920" height="800" fill="url(#shine)"/>
</svg>
